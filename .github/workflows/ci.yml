name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    # 手动触发时的跳过开关（仿 aitech-hub/ai-invest 家族惯例）：紧急发版可跳过测试/静态检查，
    # 类型检查与迁移守卫不跳过——它们防的是「发出去才发现坏」，不是风格问题。
    inputs:
      skip_lint:
        description: "跳过静态检查阶段（eslint）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      skip_test:
        description: "跳过测试阶段（单元测试）"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ============================================================
# 统一命名规范（变量=非密配置，secret=凭据；两环境同名、按 GitHub Environment 隔离）
#
#   仓库级 secret（两环境共用一套镜像仓库）：
#     TCR_NAMESPACE   镜像命名空间
#     TCR_USERNAME    TCR 用户名
#     TCR_PASSWORD    TCR 密码
#   环境级（GitHub Environments `staging` 与 `production` 各配一份，名称完全相同）：
#     var   DEPLOY_HOST    部署目标主机（user@host）
#     var   DEPLOY_PATH    服务器部署目录
#     secret DEPLOY_SSH_KEY      部署私钥
#     secret DEPLOY_KNOWN_HOSTS  主机指纹
#
#   环境路由：push main → environment `production`（tag main-<sha>）
#             push develop → environment `staging`（tag develop-<sha>）
#   两环境 secret/variable 同名，deploy job 的步骤因此完全一致。
# ============================================================
env:
  # 强制 GitHub Actions 使用 Node.js 24 runtime（checkout/setup-node 等，消弃用警告；
  # 与 aitech-hub/ai-invest 同惯例）
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # 镜像仓库地址与命名空间走仓库变量/secret：开源仓库不写死任何环境的仓库地址
  TCR_REGISTRY: ${{ vars.TCR_REGISTRY }}
  TCR_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME }}

jobs:
  # ---------------------------------------------------------------- Dockerfile 检查
  # hadolint 无 darwin-arm64 原生版，故放 GitHub 托管 runner（家族惯例）。
  # failure-threshold: error——warning 级不拦发布（钉版本一类 warning 与既有
  # 写法冲突，逐条改会污染镜像定义）。
  dockerfile-lint:
    name: Dockerfile 检查（hadolint）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/cloud/deploy/Dockerfile
          failure-threshold: error

      # 迁移载体一致性断言（仿 aitech-hub）：线上迁移由应用镜像内 migrate.ts 执行
      # （compose migrate profile 与应用同镜像），镜像必须携带 db/migrations 与
      # scripts/db——漂移的现实来源只有两处：.dockerignore 排除、Dockerfile 漏 COPY。
      # 静态断言（不构建镜像）：镜像 2 层安装动辄数分钟，而这两处都是文本可判的。
      - name: 断言镜像携带迁移集
        run: |
          set -eu
          if grep -qE '(^|/)apps/cloud/db(/|$)' .dockerignore; then
            echo "ERROR: .dockerignore 排除了 apps/cloud/db/，镜像将不带迁移集" >&2
            exit 1
          fi
          if grep -qE '(^|/)apps/cloud/scripts(/|$)' .dockerignore; then
            echo "ERROR: .dockerignore 排除了 apps/cloud/scripts/，镜像将不带迁移入口" >&2
            exit 1
          fi
          if ! grep -q 'COPY --from=build /app/apps/cloud/db' apps/cloud/deploy/Dockerfile; then
            echo "ERROR: Dockerfile 未把 db/ COPY 进 runtime 阶段" >&2
            exit 1
          fi
          if ! grep -q 'COPY --from=build /app/apps/cloud/scripts' apps/cloud/deploy/Dockerfile; then
            echo "ERROR: Dockerfile 未把 scripts/ COPY 进 runtime 阶段" >&2
            exit 1
          fi
          echo "迁移载体断言通过：镜像将携带仓库 $(ls apps/cloud/db/migrations | wc -l | tr -d ' ') 个迁移"

  # ---------------------------------------------------------------- 静态检查
  # 步骤级跳过开关：job 级跳过会经 needs 链级联跳掉 build（同 test job 的处置）
  lint:
    name: Lint / 静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install / 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Lint / 跑 eslint
        if: github.event.inputs.skip_lint != 'true'
        run: pnpm lint

  check:
    name: Check / 类型检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install / 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Check / 类型检查
        run: pnpm check

  # ---------------------------------------------------------------- 测试
  test:
    name: Test / 单元与契约测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # 必须与生产同款：检索依赖 pgvector 扩展与 pg_trgm
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: trend_suite
          POSTGRES_PASSWORD: trend_suite
          POSTGRES_DB: trend_suite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trend_suite -d trend_suite"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # 两个库必须不同：测试会重放迁移并清空目标库，指向同一个库会抹掉开发数据
      DATABASE_URL: postgres://trend_suite:trend_suite@127.0.0.1:5432/trend_suite
      TEST_DATABASE_URL: postgres://trend_suite:trend_suite@127.0.0.1:5432/trend_suite_test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install / 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Create test database / 建测试库
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U trend_suite -d postgres -c "CREATE DATABASE trend_suite_test OWNER trend_suite"

      # 媒体管线测试需要 ffmpeg 现场转出夹具（arch/05 §3）；runner 镜像不带，
      # 缺了会静默失败在夹具构建上，报错还看不出缺的是什么。
      - name: Install ffmpeg / 安装 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      # 跳过开关挂在步骤级而非 job 级：build job needs 整组检查线，
      # job 级跳过会把 build 一起跳掉（needs 链上 skipped 即级联跳过）
      - name: Test / 跑全仓测试
        if: github.event.inputs.skip_test != 'true'
        run: pnpm test

  # ---------------------------------------------------------------- 迁移守卫
  # db/migrations/ 是 schema 单一真相源；发布走「迁移先行」硬门禁（deploy.sh），
  # 守卫是 baseline 与增量漂移的唯一自动防线（仿 ai-invest 双守卫，PG 口径）。
  # 守卫本体各约 1 分钟，无条件执行——曾因按路径条件跳过让 schema 漂移漏进主干。

  # 从零重放守卫：空库全量应用 + 二次重放零新增（台账幂等）。
  db-migration-guard:
    name: 迁移守卫 / 从零重放
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # 必须与生产同款：检索依赖 pgvector 扩展与 pg_trgm
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: trend_suite
          POSTGRES_PASSWORD: trend_suite
          POSTGRES_DB: trend_suite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trend_suite -d trend_suite"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install / 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Create guard database / 建守卫库
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U trend_suite -d postgres -c "CREATE DATABASE migration_guard OWNER trend_suite"

      # 从零全量应用（migrate.ts 语义见脚本头注释：台账制、逐迁移事务）
      - name: Apply all migrations / 从零应用全部迁移
        env:
          DATABASE_URL: postgres://trend_suite:trend_suite@127.0.0.1:5432/migration_guard
        run: |
          expected="$(ls apps/cloud/db/migrations/*.sql | wc -l | tr -d ' ')"
          out="$(pnpm --filter @trend-suite/cloud migrate)"
          echo "$out"
          grep -q "applied=${expected}," <<<"$out" \
            || { echo "ERROR: 未应用全部迁移（期望 ${expected} 条）" >&2; exit 1; }

      # 二次重放必须零新增（exactly-once 台账幂等）；同时台账表必须存在
      - name: Replay idempotency / 幂等重放（应全量跳过）
        env:
          DATABASE_URL: postgres://trend_suite:trend_suite@127.0.0.1:5432/migration_guard
        run: |
          out="$(pnpm --filter @trend-suite/cloud migrate)"
          echo "$out"
          grep -q "applied=0," <<<"$out" \
            || { echo "ERROR: 重放产生了新 applied，迁移不幂等" >&2; exit 1; }
          docker exec "${{ job.services.postgres.id }}" \
            psql -U trend_suite -d migration_guard -qAt \
            -c "SELECT count(*) FROM _migrations" | grep -q '^[1-9]' \
            || { echo "ERROR: _migrations 台账为空" >&2; exit 1; }

  # 增量迁移守卫：从「线上 schema」出发验证增量路径，并断言增量结果与从零
  # 重放一致（无 schema 漂移）。重放守卫只覆盖空库从零；真实的
  # 「线上 schema → 新 schema」增量路径此前从未被自动验证过——
  # 生产迁移事故正是从这条路径漏出来的。
  # 基准 = origin/main 的迁移集（main 是发布线，生产当前跑的 schema 即由此重放而来；
  # main ⊆ develop，故 develop 上新增的迁移落在增量侧）。
  db-incremental-guard:
    name: 迁移守卫 / 增量无漂移
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: trend_suite
          POSTGRES_PASSWORD: trend_suite
          POSTGRES_DB: trend_suite
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trend_suite -d trend_suite"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 origin/main 的完整迁移集作基准，浅克隆取不到
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install / 安装依赖
        run: pnpm install --frozen-lockfile

      - name: Create guard databases / 建守卫库
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U trend_suite -d postgres \
            -c "CREATE DATABASE prod_schema OWNER trend_suite" \
            -c "CREATE DATABASE fresh_schema OWNER trend_suite"

      - name: Extract base migrations / 抽出主干迁移基准
        run: |
          set -eu
          git fetch --no-tags origin main
          mkdir -p base
          git archive origin/main apps/cloud/db/migrations | tar -x -C base
          echo "base migrations: $(ls base/apps/cloud/db/migrations | wc -l | tr -d ' ')"
          echo "current migrations: $(ls apps/cloud/db/migrations | wc -l | tr -d ' ')"

      # 主干迁移落 prod_schema（线上 schema 基准），随后增量应用本次分支的新迁移
      - name: Apply base then incremental / 主干迁移 + 增量迁移
        env:
          BASE_URL: postgres://trend_suite:trend_suite@127.0.0.1:5432/prod_schema
          CURRENT_URL: postgres://trend_suite:trend_suite@127.0.0.1:5432/prod_schema
        run: |
          set -eu
          MIGRATIONS_DIR="$PWD/base/apps/cloud/db/migrations" DATABASE_URL="$BASE_URL" \
            pnpm --filter @trend-suite/cloud migrate
          DATABASE_URL="$CURRENT_URL" pnpm --filter @trend-suite/cloud migrate

      # 从零重放全部迁移落 fresh_schema
      - name: Apply all from zero / 从零重放全部迁移
        env:
          DATABASE_URL: postgres://trend_suite:trend_suite@127.0.0.1:5432/fresh_schema
        run: pnpm --filter @trend-suite/cloud migrate

      # 断言增量与从零无漂移：比对列、索引、约束清单
      #（不比数据、不比 pg_dump 文本，避免格式噪声误报）；
      # _migrations 是迁移台账本身，两边结构同、数据不同，排除
      - name: Assert no schema drift / 断言增量与从零一致
        run: |
          set -eu
          psql() { docker exec "${{ job.services.postgres.id }}" psql -U trend_suite "$@"; }
          for db in prod_schema fresh_schema; do
            psql -d "$db" -qAt -c "
              SELECT table_name||'.'||column_name||':'||data_type||':'||is_nullable
              FROM information_schema.columns
              WHERE table_schema='public' AND table_name <> '_migrations' ORDER BY 1" > "/tmp/cols.$db"
            psql -d "$db" -qAt -c "
              SELECT tablename||'.'||indexname FROM pg_indexes
              WHERE schemaname='public' AND tablename <> '_migrations' ORDER BY 1" > "/tmp/idx.$db"
            psql -d "$db" -qAt -c "
              SELECT conrelid::regclass::text||'.'||conname||':'||contype::text
              FROM pg_constraint WHERE connamespace='public'::regnamespace ORDER BY 1" > "/tmp/con.$db"
          done
          failed=0
          for kind in cols idx con; do
            if ! diff -u "/tmp/$kind.prod_schema" "/tmp/$kind.fresh_schema"; then
              echo "ERROR: $kind 漂移：增量路径与从零路径结果不一致" >&2
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "schema 一致：列/索引/约束三清单在增量与从零路径下完全相同"

  # ---------------------------------------------------------------- 镜像构建
  build:
    name: Build / 构建镜像
    # 境内自托管 runner 构建并推镜像仓库（跨境推送链路不稳定，见前身系统实测记录）；
    # 常驻 ci-builder 构建器配了国内镜像源且缓存跨 job 持久。
    runs-on: [self-hosted]
    # 仓库为 public：PR（含 fork）绝不在自托管机上执行仓库代码。
    # 镜像构建只在主干 push 上跑——develop 的 push 同样构建（staging 发布用），
    # Dockerfile 写坏了在进 main 之前就会暴露。workflow_dispatch 是发布前演练入口。
    if: (github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')) || github.event_name == 'workflow_dispatch'
    # 预算 = 构建 20 + 推送 35（内含三次 600s 看门狗）+ 收尾
    timeout-minutes: 60
    # 检查线全绿后才进镜像构建（家族惯例：aitech-hub docker-release 同款 needs 集）；
    # skip_lint / skip_test 是步骤级开关，lint/test job 本身恒成功，不会级联跳过 build
    needs: [dockerfile-lint, lint, check, test, db-migration-guard, db-incremental-guard]
    steps:
      - uses: actions/checkout@v4

      # 常驻 buildx 构建器：不用 setup-buildx-action（临时 builder 无镜像源配置，
      # Docker Hub 直连拉不到 node:22-alpine，且缓存不持久）
      - name: Select builder / 选择构建器
        run: docker buildx use ci-builder

      # 镜像仓库路径由 secret 拼装；缺失就明确失败，
      # 不推到写死在 YAML 里的命名空间（推错仓库等于把坏镜像发到线上）
      - name: Preconditions / 前置校验
        run: |
          set -eu
          [ -n "${{ env.TCR_REGISTRY }}" ] || { echo "ERROR: 未配置仓库变量 TCR_REGISTRY" >&2; exit 1; }
          [ -n "${{ env.TCR_NAMESPACE }}" ] || { echo "ERROR: 未配置仓库 secret TCR_NAMESPACE" >&2; exit 1; }
          [ -n "${{ env.IMAGE_NAME }}" ] || { echo "ERROR: 未配置仓库变量 IMAGE_NAME" >&2; exit 1; }
          echo "镜像目标：${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}"

      - name: Resolve tag / 解析镜像标签（<branch>-<sha7>，不可变）
        id: vars
        run: |
          sha_short="$(git rev-parse --short=7 "$GITHUB_SHA")"
          case "$GITHUB_REF" in
            refs/heads/main)    tag="main-${sha_short}" ;;
            refs/heads/develop) tag="develop-${sha_short}" ;;
            # 手动触发（发布前演练）可以落在任意分支上，按分支名打 tag
            *)                 tag="$(basename "$GITHUB_REF" | tr '/' '-')-${sha_short}" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$TCR_REGISTRY/$TCR_NAMESPACE/$IMAGE_NAME:$tag" >> "$GITHUB_OUTPUT"

      # id 供重试条件用：登录失败属配置错误，不进重试（避免白建镜像且盖住真错）
      - name: Login TCR / 登录镜像仓库
        id: login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      # 只构建不入库：load 进本地 docker，推送交给后面的独立步骤——挂死时只需重推，不必重建。
      # --provenance=false：TCR 不认 OCI attestation 附加清单
      - name: Build / 本地构建镜像
        id: build
        timeout-minutes: 20
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          set -euo pipefail
          docker buildx build --builder ci-builder --platform linux/amd64 \
            --build-arg GIT_SHA="$GITHUB_SHA" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --file apps/cloud/deploy/Dockerfile --load --provenance=false \
            --tag "$IMAGE" .

      # 每次推送自带看门狗：docker push 走跨境链路，卡住时不会自己返回，
      # 也不认超时参数；runner 是 macOS（BSD userland，无 GNU timeout），
      # 故用「后台进程 + 轮询 ps 状态」实现单次 600 秒上限，超时杀掉后重试。
      - name: Push to TCR / 推送镜像
        id: push
        continue-on-error: true
        timeout-minutes: 35
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          PUSH_ATTEMPTS: 3
          PUSH_DEADLINE_S: 600
        run: |
          set -euo pipefail

          push_once() {
            local image="$1" limit_s="$2" pid waited=0 stat
            docker push "$image" &
            pid=$!
            while :; do
              stat="$(ps -o stat= -p "$pid" 2>/dev/null || true)"
              case "$stat" in
                ""|Z*) break ;;
              esac
              if [ "$waited" -ge "$limit_s" ]; then
                echo "[push] 单次推送超过 ${limit_s}s 仍无进展，终止本次尝试" >&2
                kill -TERM "$pid" 2>/dev/null || true
                sleep 2
                kill -KILL "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                return 124
              fi
              sleep 5
              waited=$((waited + 5))
            done
            wait "$pid"
          }

          attempt=1
          while [ "$attempt" -le "$PUSH_ATTEMPTS" ]; do
            echo "[push] 第 $attempt/$PUSH_ATTEMPTS 次：$IMAGE"
            if push_once "$IMAGE" "$PUSH_DEADLINE_S"; then
              exit 0
            fi
            echo "[push] 第 $attempt 次失败" >&2
            attempt=$((attempt + 1))
            # 不用 `[ ... ] && sleep`：条件为假时复合命令返回 1，set -e 下会误终止
            if [ "$attempt" -le "$PUSH_ATTEMPTS" ]; then
              sleep 10
            fi
          done
          echo "[push] $PUSH_ATTEMPTS 次全部失败" >&2
          exit 1

      - name: Conclude build outcome / 构建推送结论裁定
        if: always()
        # 裁定顺序 = 登录 → 构建 → 推送：前一步失败时后一步 outcome 是 skipped，
        # 不按顺序判就会把「登录失败」报成「构建失败」
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
        run: |
          if [ "${{ steps.login.outcome }}" != "success" ]; then
            echo "[FAIL] 镜像仓库登录失败（配置问题，重试无意义）" >&2
            exit 1
          fi
          if [ "${{ steps.build.outcome }}" != "success" ]; then
            echo "[FAIL] 镜像构建失败" >&2
            exit 1
          fi
          if [ "${{ steps.push.outcome }}" = "success" ]; then
            echo "[OK] 镜像推送成功：$IMAGE"
          else
            echo "[FAIL] 镜像推送失败（重试耗尽）" >&2
            exit 1
          fi

  # ---------------------------------------------------------------- 部署（staging / production 统一）
  deploy:
    name: Deploy ${{ github.ref == 'refs/heads/main' && 'Production / 生产环境发布' || 'Staging / 测试环境发布' }}
    runs-on: ubuntu-latest
    needs: [build]
    # 环境路由：main → production（生产），develop → staging（测试）
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    # 同名 secret/variable 按环境隔离（DEPLOY_HOST / DEPLOY_PATH / DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS）
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    timeout-minutes: 60
    # 同一环境串行发布，绝不并发；不同环境互不阻塞
    concurrency:
      group: deploy-${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      # 部署目标环境（deploy.sh 的 --env）：main → prod，develop → staging
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      # 主机与路径走环境变量、密钥走环境 secret，缺任何一项都明确失败，
      # 不带着半套配置继续发布（否则 ssh 会用空 host 报一堆看不懂的错）
      - name: Preconditions / 前置校验
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu
          [ -n "$DEPLOY_HOST" ] || { echo "ERROR: 未配置环境变量 DEPLOY_HOST（environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}）" >&2; exit 1; }
          [ -n "$DEPLOY_PATH" ] || { echo "ERROR: 未配置环境变量 DEPLOY_PATH" >&2; exit 1; }
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "ERROR: 未配置环境 secret DEPLOY_SSH_KEY" >&2; exit 1; }
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "ERROR: 未配置环境 secret DEPLOY_KNOWN_HOSTS" >&2; exit 1; }
          [ -n "${{ env.TCR_NAMESPACE }}" ] || { echo "ERROR: 未配置仓库 secret TCR_NAMESPACE" >&2; exit 1; }

      - name: Setup SSH key / 配置免密密钥与主机指纹
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Resolve tag / 解析镜像标签
        id: vars
        run: echo "sha_short=$(git rev-parse --short=7 "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Snapshot server state / 记录发布前现场
        # 快照是尽力而为的记录步骤：首部署时 compose 文件尚未同步（下一步才送），
        # compose ps 失败不该中止发布；远程命令内 || true 只吞快照本身的失败，
        # ssh 连不上仍会以非零退出（远程脚本根本没机会执行）
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' 2>/dev/null || exit 0; echo '--- 状态文件 ---' && cat .deploy-state 2>/dev/null; echo '--- 当前 IMAGE_TAG ---' && grep -E '^IMAGE_TAG=' .env.${{ env.DEPLOY_ENV }} 2>/dev/null; echo '--- 当前容器 ---' && sudo env ENV_FILE='.env.${{ env.DEPLOY_ENV }}' docker compose --env-file .env.${{ env.DEPLOY_ENV }} -f docker-compose-prod.yml ps --format '{{.Service}} {{.Image}} {{.State}}' 2>/dev/null || true"

      - name: Sync deploy assets / 同步部署资产到服务器
        # 送什么：部署脚本、compose、Caddy 配置、备份脚本。
        # 迁移文件不进资产包——迁移随应用镜像走（migrate 服务与应用同镜像），
        # 线上执行的迁移必然与本次发布的代码同 commit。
        # 插件分发件（coach tarball + releases.json）就绪后在此追加进资产包。
        run: |
          set -eu
          cd apps/cloud
          COPYFILE_DISABLE=1 tar -czf /tmp/deploy-assets.tar.gz \
            cicd/deploy.sh \
            deploy/caddy/Caddyfile \
            scripts/ops/backup.sh \
            docker-compose-prod.yml
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            /tmp/deploy-assets.tar.gz "$DEPLOY_HOST:/tmp/deploy-assets.tar.gz"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            sudo bash -s -- "$DEPLOY_PATH" "$GITHUB_SHA" <<'REMOTE'
          set -eu
          cd "$1"
          # --no-same-owner：不让归档里的 uid/gid 覆盖服务器属主
          tar --no-same-owner -xzf /tmp/deploy-assets.tar.gz
          rm -f /tmp/deploy-assets.tar.gz
          chmod 755 cicd/deploy.sh scripts/ops/backup.sh
          printf '%s\n' "$2" > .deploy-commit
          # 资产落地完整性校验：缺任何一项都中止，不带着半套资产继续发布
          for f in cicd/deploy.sh deploy/caddy/Caddyfile scripts/ops/backup.sh docker-compose-prod.yml; do
              [ -f "$f" ] || { echo "ERROR: 资产缺失：$f" >&2; exit 1; }
          done
          # 运行期目录：数据都在 workspace/ 下（compose 挂载点）
          mkdir -p workspace/postgres workspace/pipeline workspace/caddy/data workspace/caddy/config workspace/backups
          # app 容器以 node（uid 1000）写入管线目录
          chown -R 1000:1000 workspace/pipeline
          echo "--- 已同步：部署资产齐全 ---"
          REMOTE

      - name: Deploy / 发布（备份 → 迁移先行 → 换容器 → 健康检查 → 失败自动回滚）
        # --image-repo 与 build job 的推送目标同源（同一组 env），
        # 服务器拉的仓库与 CI 推的仓库严格一致，不会因 namespace 变更而拉空
        env:
          BRANCH_TAG: ${{ github.ref == 'refs/heads/main' && 'main' || 'develop' }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && sudo bash cicd/deploy.sh --env '${{ env.DEPLOY_ENV }}' --tag '${{ env.BRANCH_TAG }}-${{ steps.vars.outputs.sha_short }}' --image-repo '${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}'"

      - name: Verify / 核对发布结果
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && echo '--- 状态文件 ---' && cat .deploy-state && echo '--- 容器 ---' && sudo env ENV_FILE='.env.${{ env.DEPLOY_ENV }}' docker compose --env-file .env.${{ env.DEPLOY_ENV }} -f docker-compose-prod.yml ps --format '{{.Service}} {{.Image}} {{.State}}'"
