# 本地开发：只起 PostgreSQL（npm run db:up）。
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: trend_suite
      POSTGRES_PASSWORD: trend_suite
      POSTGRES_DB: trend_suite
    ports:
      - "5435:5432"
    volumes:
      - ./workspace/postgres:/var/lib/postgresql/data
      - ./db/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trend_suite -d trend_suite"]
      interval: 3s
      timeout: 3s
      retries: 20

# 持久化数据统一由 ./workspace 承接，不使用命名卷。
