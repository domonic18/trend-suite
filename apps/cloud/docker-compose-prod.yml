# 部署 compose（app + db + migrate profile + caddy）——staging 与 production 共用一份：
#   测试环境：docker compose --env-file .env.staging -f docker-compose-prod.yml ...（CI 自动，push main）
#   生产环境：docker compose --env-file .env.prod    -f docker-compose-prod.yml ...（CI 自动，push main 后经 production 审批）
# 发布唯一入口是 cicd/deploy.sh（备份 → 迁移先行 → 换容器 → 健康检查 → 失败回滚），
# 不要手工 compose up。约束见 docs/arch/02云端服务架构.md §8.1。
#
# 【项目名】不写死 name:——compose 项目名取部署目录名，两环境靠目录名区分
#   （trend-suite-staging / trend-suite）。写死同一个 name 会让两个环境抢同一批容器：
#   staging 的 compose up 会直接替换掉生产的 app 容器（生产即中断），而两边看起来都“成功”。
# 【env_file】由调用方导出 ENV_FILE 指定，且是必填——不导出就直接失败：
#   漏导出时若给了默认值，staging 容器会静默加载 .env.prod（域名与数据库口令串环境）。
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?在 env 文件设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 env 文件设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?在 env 文件设置 POSTGRES_DB}
    volumes:
      - ./workspace/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  app:
    build:
      # 构建上下文是 monorepo 根目录（pnpm workspace），见 apps/cloud/deploy/Dockerfile。
      # 线上发布不走这条路：镜像由 CI 构建并推 TCR，服务器只 pull（deploy.sh 带 --no-build）。
      context: ../..
      dockerfile: apps/cloud/deploy/Dockerfile
    image: ${TREND_IMAGE_REPO:-<registry>/<namespace>/trend-suite}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ${ENV_FILE:?未设置 ENV_FILE（deploy.sh 会导出；缺了会加载错环境的配置）}
    environment:
      # next start 读 HOSTNAME/PORT：容器内必须绑 0.0.0.0，宿主端口由 caddy 反代
      HOSTNAME: 0.0.0.0
      PORT: "3940"
      # 密码含特殊字符时需先 URL 编码
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # 管线工作区与 HLS 输出必须在同一挂载点内，HLS 才能原子 rename（arch/05 §3.2）
      - ./workspace/pipeline:/data
      # 媒体定案走 COS（生产），无此项；local 模式（开发测试）媒体走 /media
      - ${MEDIA_HOST_DIR:-./workspace/media}:/media
    networks: [edge, backend]

  # 加工 worker（arch/02 §7）：与 app 同一个镜像，靠 APP_ROLE=worker 区分。
  # 认领 pipeline_jobs 里的任务跑加工阶段——抽音频 → 转写 → 关键帧 → 索引。
  # 与 app 挂同一批卷：原片与关键帧要互相可见（app 取帧、worker 写帧）。
  worker:
    image: ${TREND_IMAGE_REPO:-<registry>/<namespace>/trend-suite}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ${ENV_FILE:?未设置 ENV_FILE（deploy.sh 会导出；缺了会加载错环境的配置）}
    environment:
      APP_ROLE: worker
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["node", "--conditions=react-server", "--import", "tsx", "src/worker.ts"]
    # worker 是纯任务进程，不监听端口——不关掉会继承镜像里探 HTTP /health
    # 的 HEALTHCHECK，永远 unhealthy，up --wait 直接判部署失败（2026-11-17
    # staging 发布实锤：worker unhealthy 触发回滚，回滚目标又是无 worker
    # 的旧镜像，崩溃循环连带回滚也失败）。
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./workspace/pipeline:/data
      - ${MEDIA_HOST_DIR:-./workspace/media}:/media
    networks: [edge, backend]

  # 迁移是一次性动作，不常驻：profile 让 compose up 不启动它，
  # 发布时用 `docker compose run --rm --no-deps --pull never -T migrate` 触发。
  # 与应用同一个镜像——迁移文件随镜像版本化，线上执行的迁移必然与本次发布的代码同 commit。
  migrate:
    image: ${TREND_IMAGE_REPO:-<registry>/<namespace>/trend-suite}:${IMAGE_TAG:-latest}
    profiles: [migrate]
    command: ["node", "--import", "tsx", "scripts/db/migrate.ts"]
    restart: "no"
    env_file: ${ENV_FILE:?未设置 ENV_FILE（deploy.sh 会导出；缺了会加载错环境的配置）}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  # 种子账号与迁移同一个镜像、同一条发布链路：迁移后跑一次，幂等创建初始管理员
  # （凭据来自 env 文件的 BOOTSTRAP_ADMIN_USERNAME / BOOTSTRAP_ADMIN_PASSWORD，不入仓库）。
  # 未配置这两个变量时脚本自己跳过——不配也能发布，只是暂时没有管理账号。
  seed:
    image: ${TREND_IMAGE_REPO:-<registry>/<namespace>/trend-suite}:${IMAGE_TAG:-latest}
    profiles: [migrate]
    command: ["node", "--conditions=react-server", "--import", "tsx", "scripts/db/seed.ts"]
    restart: "no"
    env_file: ${ENV_FILE:?未设置 ENV_FILE（deploy.sh 会导出；缺了会加载错环境的配置）}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    # 宿主端口变量化：production 沿用前身系统让出的 80/443
    # （切换时前身系统先迁到 8081/8443 让位）；staging 用 8080/8443。
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?在 env 文件设置 DOMAIN}
      # TLS_LOCAL_CERTS 留空 = 走公网 ACME（生产，占用 80/443 时签发）；
      # 置 local_certs = 用 caddy 内置 CA 自签（预发：80 被前身系统占着，ACME 签不出来）
      TLS_LOCAL_CERTS: ${TLS_LOCAL_CERTS:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./workspace/caddy/data:/data
      - ./workspace/caddy/config:/config
    networks: [edge]

networks:
  edge:
  backend:

# 持久化数据统一由 ./workspace 承接（postgres / pipeline / caddy），不使用命名卷。
