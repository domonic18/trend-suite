<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首启向导</title><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#131418;--panel:#1A1C22;--panel2:#21242C;--line:#282C35;--line2:#22252D;
--ink:#E8EBF0;--ink2:#BCC2CC;--mut:#878E9A;
--jade:#3DBE9B;--jade-bg:#15302B;--up:#E0564F;--up-bg:#2A1B1A;--down:#31A984;--amber:#D9A441;
--mono:ui-monospace,"SF Mono",Menlo,monospace}
html,body{height:100%}
body{font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.7;-webkit-font-smoothing:antialiased}
.win{max-width:1200px;margin:22px auto;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);box-shadow:0 18px 60px rgba(0,0,0,.45)}
.tbar{display:flex;align-items:center;gap:10px;height:38px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 12px}
.dots{display:flex;gap:6px}.dots i{width:11px;height:11px;border-radius:50%}
.ttl{flex:1;text-align:center;font-size:12px;color:var(--mut)}
.hz{display:inline-flex;align-items:center;gap:6px;font:500 10.5px var(--mono);color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:2px 8px}
.hz b{color:var(--ink2);font-weight:600}
.cols{display:grid;grid-template-columns:198px 1fr 292px;min-height:560px}
.side{background:var(--panel);border-right:1px solid var(--line2);padding:12px 9px}
.side h4{font-size:10.5px;font-weight:500;color:var(--mut);padding:0 9px 7px;letter-spacing:.3px}
.ss{display:flex;gap:8px;align-items:center;padding:7px 9px;border-radius:6px;color:var(--ink2);font-size:12.5px}
.ss.on{background:var(--panel2);color:var(--ink);box-shadow:inset 2px 0 0 var(--jade)}
.chat{display:flex;flex-direction:column;min-width:0}
.panel{background:var(--panel);border-left:1px solid var(--line2);padding:14px 13px;overflow:auto}
.ptabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin:-14px -13px 12px;padding:0 13px}
.ptab{padding:9px 2px;margin-right:14px;font-size:12.5px;color:var(--mut);border-bottom:2px solid transparent}
.ptab.on{color:var(--ink);border-bottom-color:var(--jade)}
h3.p{font-size:11px;font-weight:600;color:var(--mut);margin:14px 0 7px;letter-spacing:.3px}
h3.p:first-child{margin-top:0}
.msg{display:flex;gap:11px;padding:13px 22px;max-width:820px}
.msg .who{width:24px;height:24px;border-radius:7px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;margin-top:2px}
.who-a{background:var(--jade);color:#0B1512}.who-u{background:var(--panel2);color:var(--ink2);border:1px solid var(--line)}
.bub{font-size:13.5px;line-height:1.75;color:var(--ink)}
.bub b{color:#fff}
.dim{font-size:11.5px;color:var(--mut)}
.segc{display:inline-block;font:500 11px var(--mono);background:#182028;border:1px solid #2C3A47;border-radius:5px;padding:1px 7px;color:#7FD7BC;margin:0 3px 3px 0;cursor:pointer}
.segc:hover{border-color:var(--jade)}
.sys{display:flex;gap:9px;align-items:center;margin:4px 22px;border-radius:8px;padding:8px 13px;font-size:12.5px}
.sys.quota{background:#241D10;border:1px solid #4E3D1B;color:#E4C27C}
.sys.empty{background:#1D222B;border:1px solid #313947;color:#9FB0C5}
.sys .act{margin-left:auto;font-weight:600;color:var(--jade);cursor:pointer;white-space:nowrap}
.comp{display:flex;gap:9px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 13px;margin:12px 22px}
.comp input{flex:1;background:none;border:none;outline:none;color:var(--ink);font:inherit;font-size:13px}
.comp .mic{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--mut);display:grid;place-items:center;cursor:pointer}
.comp .snd{height:30px;padding:0 13px;border:none;border-radius:8px;background:var(--jade);color:#0B1512;font:600 12.5px inherit;cursor:pointer}
.ctx{display:flex;gap:8px;align-items:center;margin:0 22px 8px;font-size:11.5px;color:var(--mut)}
.ctx .x{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:5px;padding:2px 8px}
.ctx .x u{cursor:pointer;color:var(--ink2)}
.qbox{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:12px}
.qtop{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut);margin-bottom:7px}
.qbar{height:4px;border-radius:2px;background:#161920;overflow:hidden}.qbar i{display:block;height:100%;background:var(--jade)}
.qnum{font:600 12px var(--mono);color:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:12.5px;color:var(--ink2)}
.kv .k{color:var(--mut)}
.lnk{color:var(--jade);font-size:12.5px;cursor:pointer}
.note-d{font-size:11.5px;color:var(--mut);line-height:1.6}
.sw{width:28px;height:16px;border-radius:9px;background:#2A2E37;position:relative;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#878E9A}
.sw.on{background:var(--jade)}.sw.on::after{left:14px;background:#0B1512}
:focus-visible{outline:2px solid var(--jade);outline-offset:1px}
</style></head><body><div class="win"><div class="tbar"><div class="dots"><i style="background:#F0564F"></i><i style="background:#F2BD3D"></i><i style="background:#59C05A"></i></div><div class="ttl">趋势伴学 · 首启向导</div><span class="hz">dsh <b>0.2.1</b> · trend-student</span></div><div style="display:flex;flex-direction:column;align-items:center;padding:52px 48px 40px">
 <div style="width:52px;height:52px;border-radius:50%;background:var(--jade-bg);border:1px solid #2A5B4E;display:grid;place-items:center">
   <svg width="24" height="24" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7" fill="none" stroke="#3DBE9B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
 <div style="font-size:19px;font-weight:650;margin-top:14px">安装完成，只剩一步</div>

   <span class="dim" style="margin-left:6px;font-size:11.5px">登录并绑定设备</span>
 </div>
 <div style="width:400px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:20px 22px">

   <div>
    <div style="font:600 30px var(--mono);letter-spacing:10px;color:#fff">8427</div>

   <div style="width:1px;height:52px;background:var(--line)"></div>

  </div>
  <div class="kv" style="margin-top:14px;border-top:1px solid var(--line2);padding-top:10px">
    <span class="k">授权页</span><span class="lnk" style="font:500 11.5px var(--mono)">https://trend.example.com/device · 已打开</span></div>
 </div>
 <div class="dim" style="margin-top:24px;text-align:center">等待批准中…… 批准后自动进入学习，注册赠额即时到账<br>令牌只存本机凭据库 · 设备与账号绑定 · 可随时解绑</div>
