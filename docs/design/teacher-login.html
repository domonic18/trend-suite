<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 · 生产工作台 · 趋势课程</title>
<link rel="stylesheet" href="assets/tokens.css"><link rel="stylesheet" href="assets/family-admin.css">
<style>
.login-page{height:100vh;display:grid;grid-template-columns:1.15fr .85fr}
.login-aside{
  padding:56px 52px;display:flex;flex-direction:column;
  background:radial-gradient(circle at 18% 18%, rgba(94,106,210,.28), transparent 42%),
             radial-gradient(circle at 82% 76%, rgba(52,211,153,.12), transparent 38%),
             #0c0e12;color:#dbe7fb;
}
.login-aside .mk{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--pri),#7a84e0);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700}
.login-aside h2{font-size:24px;font-weight:650;margin:26px 0 8px;color:#fff}
.login-aside p{font-size:13.5px;line-height:1.8;color:#9db4dd;max-width:40ch}
.login-aside ul{list-style:none;margin:18px 0 0;padding:0;font-size:13px;color:#b9c6e4;line-height:2.1}
.login-aside ul li::before{content:"—";color:#7a84e0;margin-right:10px}
.login-aside .mini{margin-top:auto;border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:14px 16px;font-size:12.5px;background:rgba(255,255,255,.05);color:#9db4dd;line-height:1.9}
.login-aside .mini b{color:#e8eefc}
.login-form{display:flex;flex-direction:column;justify-content:center;padding:48px 56px;background:var(--bg)}
.login-card{max-width:400px}
.login-card h1{font-size:21px;font-weight:650;margin-bottom:4px}
.login-card .sub{font-size:13.5px;color:var(--mut);margin-bottom:24px}
.login-card .fitem{margin-bottom:16px}
.flabel{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}
</style></head><body>
<div class="login-page">
 <div class="login-aside">
  <span class="mk">势</span>
  <h2>生产工作台</h2>
  <p>与制作 Agent 协作完成课件生产：上传素材，Agent 起草方案；你只在方案确认与成品审核两个决策点把关。</p>
  <ul>
   <li>模型云端预置，零安装、零密钥</li>
   <li>九步生产引擎由云端 Worker 执行</li>
   <li>教师写入恒为 draft，签批与发布归运营</li>
  </ul>
  <div class="mini">仅 <b>producer</b> 角色可登录本工作台；学员入口在<a href="portal.html" style="color:#9db4dd;text-decoration:underline">官网门户</a>。</div>
 </div>
 <div class="login-form">
  <div class="login-card">
   <h1>登录生产工作台</h1>
   <div class="sub">浏览器会话 · sessionStorage，不落 Cookie</div>
   <div class="fitem">
    <label class="flabel" for="l-user">用户名</label>
    <input class="inp" id="l-user" style="width:100%;height:38px;padding:8px 12px" type="text" value="zhoulaoshi" autocomplete="username">
   </div>
   <div class="fitem">
    <label class="flabel" for="l-pass">密码</label>
    <input class="inp" id="l-pass" style="width:100%;height:38px;padding:8px 12px" type="password" autocomplete="current-password" placeholder="输入密码">
   </div>
   <a class="b b-pri blk" href="teacher-workbench.html" style="height:40px;font-size:14px">登录</a>
   <p class="note" style="margin-top:16px">首次使用请联系运营创建 producer 账号（<a href="ops-accounts.html">账号管理</a> · 一次性邀请码）；忘记密码由管理员重置。</p>
  </div>
 </div>
</div>
</body></html>
