<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="assets/tokens.css"><link rel="stylesheet" href="assets/family-portal.css"><link rel="stylesheet" href="assets/family-ops.css"><link rel="stylesheet" href="assets/family-teacher.css"><link rel="stylesheet" href="assets/family-agent.css">
<style>
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(236px,1fr));gap:14px}
.ccard{display:flex;flex-direction:column;gap:10px;background:#fff;border:1px solid var(--p-line);border-radius:12px;padding:16px;color:inherit;text-decoration:none;transition:border-color .12s,box-shadow .12s}
.ccard:hover{border-color:#b9c6dd;box-shadow:0 6px 18px rgba(16,24,40,.06)}
.cc-top{display:flex;align-items:center;gap:8px}
.cc-top b{font-size:14.5px}
.cc-top .tag{margin-left:auto}
.cc-meta{font-size:12px;color:var(--p-mut);line-height:1.7}
.cc-bar{height:5px;border-radius:3px;background:var(--p-soft);overflow:hidden}
.cc-bar i{display:block;height:100%;background:var(--p-pri)}
.cc-bar i.ok{background:#0f9d76}
.cc-foot{display:flex;align-items:center;gap:6px;font-size:11.5px;color:#9aa3b8;margin-top:auto}
.cc-foot .go{margin-left:auto;color:var(--p-pri);font-weight:600}
.ccard.add{align-items:center;justify-content:center;border-style:dashed;background:#fafbfd;color:var(--p-mut);font-size:13px;min-height:150px;cursor:pointer}
.ccard.add:hover{color:var(--p-pri);border-color:var(--p-pri)}
.ccard.add svg{width:18px;height:18px}
dialog.newc{border:none;border-radius:14px;padding:0;width:440px;box-shadow:0 24px 64px rgba(16,24,40,.28)}
dialog.newc::backdrop{background:rgba(16,24,40,.42)}
.newc .nh{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--p-line)}
.newc .nh b{font-size:15px}
.newc .nh .x{margin-left:auto;border:none;background:none;font-size:20px;line-height:1;color:#9aa3b8;cursor:pointer}
.newc .nb{padding:14px 16px;display:grid;gap:10px}
.newc .nf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--p-line);background:#fafbfd}
</style></head><body><svg style="display:none" xmlns="http://www.w3.org/2000/svg">
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M20 17H6.5A2.5 2.5 0 0 0 4 19.5" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
<symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h7l5 5v13H6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M13 3v5h5M9 13h6M9 17h4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>

<dialog class="newc" id="new-course">
 <form method="dialog">
  <div class="nh"><b>新建课程</b><button class="x" value="cancel" aria-label="关闭">×</button></div>

   <div><div class="note" style="margin-bottom:5px">课程名称</div><input class="fi" placeholder="例：筹码分布卷"></div>
